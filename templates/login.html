<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#4d1f91,#16a4b8);min-height:100vh;display:grid;place-items:center}
.card{width:min(420px,calc(100% - 32px));background:white;padding:28px;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h1{margin-top:0}label{display:block;font-weight:800;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;box-sizing:border-box}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#6f35c5;color:white;font-weight:900}.error{color:#be3144}
</style></head>
<body><form class="card" method="post"><h1>Store Admin</h1><p>Sign in to manage products and fees.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<label>Username</label><input name="username" required>
<label>Password</label><input name="password" type="password" required>
<button>Sign In</button></form></body>
</html>
