<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0c0717;color:#fff;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{padding:18px 4vw;display:flex;justify-content:space-between;border-bottom:1px solid #38294a}.wrap{width:min(1200px,calc(100% - 28px));margin:24px auto}.card{background:#17102a;border:1px solid #38294a;border-radius:20px;padding:20px;margin-bottom:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.item{padding:14px;border:1px solid #38294a;border-radius:14px;margin:10px 0}.muted{color:#aa9db8}.row{display:flex;justify-content:space-between;gap:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #38294a;border-radius:9px;background:#100a1d;color:#fff}label{display:block;font-size:.8rem;font-weight:850;margin:5px 0}button,.button{display:inline-block;padding:10px 13px;border:0;border-radius:9px;color:#fff;font-weight:900;background:linear-gradient(110deg,#ef3d98,#9b4dcc,#50d6d0)}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}}</style><title>{{ performance.title }}</title></head><body><header><strong>🎬 #{{ performance.performance_order }} {{ performance.title }}</strong><a href="/admin/production/shows/{{ performance.show_id }}">Show</a></header><main class="wrap"><div class="grid"><section class="card"><h2>Stage Cues</h2><form method="post" action="/admin/production/performances/{{ performance.id }}/cues"><div class="fields"><div><label>Lights</label><input name="lights_cue" value="{{ cues.lights_cue or '' }}"></div><div><label>Music</label><input name="music_cue" value="{{ cues.music_cue or '' }}"></div><div><label>Curtain</label><input name="curtain_cue" value="{{ cues.curtain_cue or '' }}"></div><div><label>Props</label><input name="props_cue" value="{{ cues.props_cue or '' }}"></div><div class="full"><label>Stage note</label><textarea name="stage_note">{{ cues.stage_note or '' }}</textarea></div><label><input type="checkbox" name="photo_allowed" {% if cues.photo_allowed is not defined or cues.photo_allowed %}checked{% endif %}> Photography allowed</label><label><input type="checkbox" name="video_allowed" {% if cues.video_allowed is not defined or cues.video_allowed %}checked{% endif %}> Video allowed</label></div><button>Save Cues</button></form></section><section class="card"><h2>Add Dancer</h2><form method="post" action="/admin/production/performances/{{ performance.id }}/dancers/add"><select name="student_id">{% for s in all_students %}<option value="{{ s.id }}">{{ s.preferred_name or s.first_name }} {{ s.last_name }}</option>{% endfor %}</select><p><button>Add</button></p></form></section></div><section class="card"><h2>Dancers</h2>{% for d in dancers %}<div class="item"><strong>{{ d.preferred_name or d.first_name }} {{ d.last_name }}</strong><form method="post" action="/admin/production/dancers/{{ d.id }}/update"><div class="fields"><div><label>Dressing room</label><input name="dressing_room" value="{{ d.dressing_room }}"></div><div><label><input type="checkbox" name="quick_change" {% if d.quick_change %}checked{% endif %}> Quick change</label></div><div class="full"><label>Backstage note</label><input name="backstage_note" value="{{ d.backstage_note }}"></div></div><button>Update</button></form></div>{% endfor %}</section></main></body></html>
