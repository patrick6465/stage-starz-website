<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ template.name }}</title><style>
:root{--bg:#0c0717;--panel:#17102a;--line:#38294a;--muted:#aa9db8;--pink:#ef3d98;--purple:#9b4dcc;--teal:#50d6d0;--gold:#ffc867;--danger:#ff6c7d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1250px,calc(100% - 28px));margin:28px auto 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.metric{font-size:1.8rem;font-weight:950}.muted{color:var(--muted)}label{display:block;font-size:.8rem;font-weight:850;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#100a1d;color:#fff}button,.button{display:inline-block;padding:10px 13px;border:0;border-radius:9px;color:#fff;font-weight:900;background:linear-gradient(110deg,var(--pink),var(--purple),var(--teal));cursor:pointer}.danger{background:var(--danger)}.item{display:block;padding:14px;border:1px solid var(--line);border-radius:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:6px 9px;border-radius:999px;background:rgba(80,214,208,.13);color:var(--teal);font-size:.72rem;font-weight:900}@media(max-width:850px){.stats,.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><main class="wrap"><section class="card"><a href="/admin/notifications">← Notification Center</a><h1>Edit Template</h1><form method="post" action="/admin/notifications/templates/save"><input type="hidden" name="id" value="{{ template.id }}"><div class="fields"><div><label>Name</label><input name="name" value="{{ template.name }}" required></div><div><label>Category</label><input name="category" value="{{ template.category }}"></div><div class="full"><label>Subject</label><input name="subject" value="{{ template.subject }}"></div><div class="full"><label>Body</label><textarea name="body_text" rows="14">{{ template.body_text }}</textarea></div><div class="full"><label><input type="checkbox" name="active" {% if template.active %}checked{% endif %} style="width:auto"> Active</label></div></div><p><button>Save Template</button></p></form></section></main></body></html>
