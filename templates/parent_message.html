<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message</title><style>
:root{--bg:#0c0717;--panel:#17102a;--panel2:#100a1d;--line:#38294a;--muted:#aa9db8;--pink:#ef3d98;--purple:#9b4dcc;--teal:#50d6d0;--gold:#ffc867;--danger:#ff6c7d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#100a1d;border-right:1px solid var(--line);padding:22px 16px}.brand{font-size:1.1rem;font-weight:950;margin-bottom:22px}.side a{display:block;padding:11px 12px;border-radius:10px;margin:4px 0;color:#ddd}.side a:hover{background:#201633}.main{padding:26px}.wrap{width:min(1180px,100%);margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:1.7rem;font-weight:950}.muted{color:var(--muted)}.item{padding:13px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:.8rem;font-weight:850;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:#fff}button,.button{display:inline-block;padding:10px 13px;border:0;border-radius:9px;color:#fff;font-weight:900;background:linear-gradient(110deg,var(--pink),var(--purple),var(--teal));cursor:pointer}.danger{background:var(--danger)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(80,214,208,.12);color:var(--teal);font-size:.72rem;font-weight:900}.amount{font-size:1.25rem;font-weight:950}.notice{padding:12px;border:1px solid var(--gold);border-radius:10px;color:var(--gold)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}@media(max-width:850px){.shell{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.side nav{display:flex;gap:5px;overflow:auto}.side a{white-space:nowrap}.main{padding:16px}.grid,.stats,.fields{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">⭐ Stage Starz Parent Portal</div><nav>
<a href="/parent">Dashboard</a>
<a href="/parent/students">My Dancers</a>
<a href="/parent/schedule">Class Schedule</a>
<a href="/parent/registration">Registration</a>
<a href="/parent/attendance">Attendance</a>
<a href="/parent/billing">Billing</a>
<a href="/parent/costumes">Costumes</a>
<a href="/parent/recitals">Recitals</a>
<a href="/parent/tickets">Tickets</a>
<a href="/parent/messages">Messages</a>
<a href="/parent/documents">Documents</a>
<a href="/parent/profile">Family Profile</a>
<a href="/parent/logout">Log Out</a>
</nav></aside><main class="main"><div class="wrap"><section class="card"><a href="/parent/messages">← Messages</a><h1>{{ message.subject or message.name }}</h1><p class="muted">{{ message.category }} · {{ message.created_at }}</p><div style="white-space:pre-wrap">{{ message.body_text }}</div></section></div></main></div></body></html>
