<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Student | Stage Starz</title>
<style>
:root{--bg:#0c0717;--panel:#17102a;--line:#38294a;--muted:#aa9db8;--pink:#ef3d98;--purple:#9b4dcc;--teal:#50d6d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{padding:18px 4vw;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.wrap{width:min(900px,calc(100% - 28px));margin:24px auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:.8rem;font-weight:850;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#100a1d;color:#fff}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.check label{margin:0}button{padding:12px 16px;border:0;border-radius:10px;color:#fff;font-weight:900;background:linear-gradient(110deg,var(--pink),var(--purple),var(--teal))}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><strong>🩰 Add Student</strong><nav><a href="/admin/students">← Students</a></nav></header>
<main class="wrap"><section class="card"><form method="post" action="/admin/students/save" enctype="multipart/form-data"><div class="grid">
<div><label>First name</label><input name="first_name" required></div><div><label>Last name</label><input name="last_name" required></div>
<div><label>Preferred name</label><input name="preferred_name"></div><div><label>Birth date</label><input name="birth_date" type="date"></div>
<div><label>Family</label><select name="family_id"><option value="">Unassigned</option>{% for f in families %}<option value="{{ f.id }}">{{ f.family_name }}</option>{% endfor %}</select></div>
<div><label>Status</label><select name="status">{% for s in ['Active','Trial','Inactive','Alumni'] %}<option>{{ s }}</option>{% endfor %}</select></div>
<div class="full check"><input id="competition" name="competition_team" type="checkbox"><label for="competition">Competition team member</label></div>
<div><label>Photo</label><input name="student_photo" type="file" accept="image/*"></div><div><label>Tags</label><input name="tags" placeholder="Competition, Ballet, Preschool"></div>
<div><label>Email</label><input name="email" type="email"></div><div><label>Phone</label><input name="phone"></div>
<div><label>School</label><input name="school"></div><div><label>Grade</label><input name="grade"></div>
<div><label>Leotard size</label><input name="leotard_size"></div><div><label>Costume size</label><input name="costume_size"></div>
<div><label>Shoe size</label><input name="shoe_size"></div><div><label>Warmup size</label><input name="warmup_size"></div>
<div class="full"><label>Medical notes</label><textarea name="medical_notes" rows="4"></textarea></div>
<div class="full"><label>General notes</label><textarea name="general_notes" rows="4"></textarea></div>
</div><p><button>Save Student</button></p></form></section></main></body></html>
