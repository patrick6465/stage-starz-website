<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Class | Stage Starz</title>
<style>
body{margin:0;background:#0c0717;color:#fff;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{padding:18px 4vw;display:flex;justify-content:space-between;border-bottom:1px solid #38294a}.wrap{width:min(900px,calc(100% - 28px));margin:24px auto}.card{background:#17102a;border:1px solid #38294a;border-radius:20px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:.8rem;font-weight:850;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #38294a;border-radius:9px;background:#100a1d;color:#fff}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.check label{margin:0}button{padding:12px 16px;border:0;border-radius:10px;color:#fff;font-weight:900;background:linear-gradient(110deg,#ef3d98,#9b4dcc,#50d6d0)}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><strong>📚 Add Class</strong><a href="/admin/classes">← Classes</a></header><main class="wrap"><section class="card"><form method="post" action="/admin/classes/save"><div class="grid"><div><label>Class name</label><input name="name" required></div><div><label>Category</label><input name="category" placeholder="Jazz, Ballet, Tap"></div><div><label>Level</label><input name="level" placeholder="Mini, Intermediate, Advanced"></div><div><label>Teacher</label><select name="teacher_id"><option value="">Unassigned</option>{% for t in teachers %}<option value="{{ t.id }}">{{ t.first_name }} {{ t.last_name }}</option>{% endfor %}</select></div><div><label>Day</label><select name="day_of_week"><option value="">Choose day</option>{% for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}<option>{{ d }}</option>{% endfor %}</select></div><div><label>Room</label><input name="room"></div><div><label>Start time</label><input name="start_time" type="time"></div><div><label>End time</label><input name="end_time" type="time"></div><div><label>Capacity</label><input name="capacity" type="number" min="0" value="0"></div><div><label>Season</label><input name="season" placeholder="Fall 2026"></div><div class="full check"><input id="active" name="active" type="checkbox" checked><label for="active">Class active</label></div><div class="full"><label>Description</label><textarea name="description" rows="5"></textarea></div></div><p><button>Save Class</button></p></form></section></main></body></html>
